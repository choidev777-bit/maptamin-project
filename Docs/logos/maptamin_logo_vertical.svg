<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif; font-weight: 700; }
    </style>
    
    <!-- Centered Group for Logo Grid (Width 112) -->
    <!-- Center X = 120. Start X = 120 - 56 = 64 -->
    <g transform="translate(64, 20)">
        <!-- Row 0 -->
        <rect x="0" y="0" width="32" height="32" rx="4.8" fill="#002959"/>
        <rect x="40" y="0" width="32" height="32" rx="4.8" fill="#002959"/>
        <rect x="80" y="0" width="32" height="32" rx="4.8" fill="#002959"/>
        <!-- Row 1 -->
        <rect x="0" y="40" width="32" height="32" rx="4.8" fill="#002959"/>
        <rect x="40" y="40" width="32" height="32" rx="4.8" fill="#00C896"/> <!-- Center Green -->
        <rect x="80" y="40" width="32" height="32" rx="4.8" fill="#002959"/>
        <!-- Row 2 -->
        <rect x="0" y="80" width="32" height="32" rx="4.8" fill="#002959"/>
        <rect x="40" y="80" width="32" height="32" rx="4.8" fill="#002959"/>
        <rect x="80" y="80" width="32" height="32" rx="4.8" fill="#002959"/>
    </g>

    <!-- Text "Maptamin" - Centered below -->
    <!-- Y = 20(padding) + 112(logo) + 32(gap) + 40(approx text height) = 204 -->
    <text x="120" y="190" font-size="44" fill="#002959" text-anchor="middle" letter-spacing="-0.02em">Maptamin</text>
</svg>
