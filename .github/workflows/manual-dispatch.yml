name: Manual Search Dispatch
on:
  repository_dispatch:
    types: [manual_search]

jobs:
  run-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright Deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Clean old videos
        run: rm -rf videos/

      - name: Run Manual Search
        run: npx --yes tsx scripts/run-search.ts MANUAL ${{ github.event.client_payload.search_id }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRIGHT_DATA_HOST: ${{ secrets.BRIGHT_DATA_HOST }}
          BRIGHT_DATA_PORT: ${{ secrets.BRIGHT_DATA_PORT }}
          BRIGHT_DATA_USERNAME: ${{ secrets.BRIGHT_DATA_USERNAME }}
          BRIGHT_DATA_PASSWORD: ${{ secrets.BRIGHT_DATA_PASSWORD }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_SENDER_NUMBER: ${{ secrets.SOLAPI_SENDER_NUMBER }}
          SOLAPI_PFID: ${{ secrets.SOLAPI_PFID }}
          KAKAO_TEMPLATE_WELCOME: ${{ secrets.KAKAO_TEMPLATE_WELCOME }}
          KAKAO_TEMPLATE_WEEKLY: ${{ secrets.KAKAO_TEMPLATE_WEEKLY }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Upload Debug Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-videos
          path: videos/
