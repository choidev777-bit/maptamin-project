name: Manual Search Dispatch
on:
  repository_dispatch:
    types: [manual_search]

jobs:
  run-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Clean old videos
        run: rm -rf videos/

      - name: Run Manual Search
        run: npx --yes tsx scripts/run-search.ts MANUAL ${{ github.event.client_payload.search_id }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRIGHT_DATA_HOST: ${{ secrets.BRIGHT_DATA_HOST }}
          BRIGHT_DATA_PORT: ${{ secrets.BRIGHT_DATA_PORT }}
          BRIGHT_DATA_USERNAME: ${{ secrets.BRIGHT_DATA_USERNAME }}
          BRIGHT_DATA_PASSWORD: ${{ secrets.BRIGHT_DATA_PASSWORD }}

      - name: Upload Debug Videos
        if: always() # 실패해도 비디오는 남기기
        uses: actions/upload-artifact@v4
        with:
          name: debug-videos
          path: videos/
